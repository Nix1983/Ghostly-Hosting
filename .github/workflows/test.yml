name: Installation Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-installation:
    name: Test Installation Scripts
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up environment
        run: |
          echo "Setting up test environment..."
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck
      
      - name: Run ShellCheck on scripts
        run: |
          echo "Running ShellCheck on main scripts..."
          shellcheck start.sh build.sh
          
          echo "Running ShellCheck on lib files..."
          for file in lib/*.sh; do
            echo "Checking $file..."
            shellcheck "$file"
          done
      
      - name: Run installation tests
        run: |
          echo "Running installation test suite..."
          chmod +x test/run_all_tests.sh
          ./test/run_all_tests.sh
      
      - name: Run server setup tests
        run: |
          echo "Running server setup test suite..."
          chmod +x test/server_tests.sh
          ./test/server_tests.sh
      
      - name: Run app deployment tests
        run: |
          echo "Running app deployment test suite..."
          chmod +x test/app_tests.sh
          ./test/app_tests.sh
      
      - name: Run API integration tests
        run: |
          echo "Running API integration tests..."
          chmod +x test/api_tests.sh
          ./test/api_tests.sh
      
      - name: Test script syntax validation
        run: |
          echo "Validating shell script syntax..."
          bash -n start.sh
          bash -n build.sh
          for file in lib/*.sh; do
            echo "Validating $file..."
            bash -n "$file"
          done
      
      - name: Check for required files
        run: |
          echo "Checking for required files..."
          test -f README.md || exit 1
          test -f start.sh || exit 1
          test -f build.sh || exit 1
          test -f VERSION || exit 1
          test -d lib || exit 1
          test -f lib/common.sh || exit 1
          test -f lib/const.sh || exit 1
          test -f lib/log.sh || exit 1
          test -f lib/print.sh || exit 1
          test -f lib/server.sh || exit 1
          test -f lib/app.sh || exit 1
          test -f lib/cloudflare.sh || exit 1
          test -f lib/upcloud.sh || exit 1
          test -f lib/github.sh || exit 1
          test -f lib/nginx.sh || exit 1
          test -f lib/dotnet.sh || exit 1
          test -f lib/certbot.sh || exit 1
          test -f lib/fail2ban.sh || exit 1
          test -f lib/git.sh || exit 1
          test -f lib/server_manager.sh || exit 1
          test -f lib/app_manager.sh || exit 1
          test -f lib/timezone.sh || exit 1
          test -f lib/meta_data.sh || exit 1
          test -f lib/version.sh || exit 1
          echo "✓ All required files present"
      
      - name: Verify test coverage
        run: |
          echo "Verifying test coverage..."
          
          # Check that tests exist for main modules
          test -f test/common_tests.sh || exit 1
          test -f test/upcloud_tests.sh || exit 1
          test -f test/github_tests.sh || exit 1
          test -f test/log_tests.sh || exit 1
          test -f test/meta_data_tests.sh || exit 1
          test -f test/common_error_logging_tests.sh || exit 1
          test -f test/version_tests.sh || exit 1
          
          echo "✓ Test coverage verified"
      
      - name: Check documentation completeness
        run: |
          echo "Checking documentation..."
          
          # Check README exists and has content
          if [ -s README.md ]; then
            echo "✓ README.md exists and has content"
          else
            echo "✗ README.md missing or empty"
            exit 1
          fi
          
          # Check LICENSE exists
          if [ -f LICENSE ]; then
            echo "✓ LICENSE file exists"
          else
            echo "✗ LICENSE file missing"
            exit 1
          fi
          
          echo "✓ Documentation complete"
      
      - name: Test report generation
        if: always()
        run: |
          echo "═══════════════════════════════════════════════════════════════"
          echo "Installation Test Report"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run Number: ${{ github.run_number }}"
          echo ""
          echo "Test execution completed."
          echo "═══════════════════════════════════════════════════════════════"
